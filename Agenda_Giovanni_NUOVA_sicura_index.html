<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda di Giovanni</title>
<style>
  :root {
    --carta: #faf7f0;
    --carta-scheda: #ffffff;
    --inchiostro: #241f18;
    --inchiostro-lieve: #766c5c;
    --bordo: #e6ded0;
    --pino: #1f4b43;
    --pino-scuro: #143630;
    --ambra: #c97c2c;
    --ambra-lieve: #f4e3cc;
    --ombra: 0 8px 24px -12px rgba(36, 31, 24, 0.18);
    --raggio: 16px;
    --urgenza-oggi: #b3341f;
    --urgenza-settimana: #c97c2c;
    --urgenza-piu-avanti: #9a927f;
    --salute: #2b5f8a;
    --salute-lieve: #e3edf5;
    --finanze: #2f7d4f;
    --finanze-lieve: #e5f1e8;
    --casa: #8a5a2b;
    --casa-lieve: #f2e9de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--carta);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(31,75,67,0.05), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(201,124,44,0.06), transparent 45%);
    color: var(--inchiostro);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; color: var(--pino-scuro); margin: 0 0 6px; }
  h1 { font-size: 1.7rem; }
  button, input, textarea { font-family: inherit; font-size: 1rem; }
  input, textarea {
    padding: 10px 12px; border: 1px solid var(--bordo); border-radius: 10px;
    background: var(--carta); color: var(--inchiostro);
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--pino); outline-offset: 2px;
  }
  .input-file-nascosto {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .etichetta-file { display: inline-block; cursor: pointer; }
  textarea { width: 100%; resize: vertical; margin-bottom: 12px; }
  .testo-secondario { color: var(--inchiostro-lieve); margin: 0 0 16px; }
  .app { display: flex; min-height: 100vh; }
  .contenuto { flex: 1; padding: 32px clamp(20px, 4vw, 48px); max-width: 820px; }
  .menu { width: 240px; flex-shrink: 0; background: var(--pino); color: #f4efe2; padding: 28px 20px; position: relative; }
  .menu::after {
    content: ""; position: absolute; top: 0; right: -14px; bottom: 0; width: 14px;
    background: repeating-linear-gradient(-45deg, var(--pino), var(--pino) 6px, var(--pino-scuro) 6px, var(--pino-scuro) 12px);
    opacity: 0.35;
  }
  .menu-intestazione { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .menu-simbolo { font-size: 1.8rem; }
  .menu-intestazione h2 { color: #fff; font-size: 1.15rem; margin: 0; }
  .menu-intestazione p { margin: 0; color: #cfe0da; font-size: 0.85rem; }
  .orologio-menu {
    color: #eae4d6; font-size: 0.85rem; line-height: 1.5; text-transform: capitalize;
    padding: 10px 12px; margin-bottom: 22px; background: rgba(255,255,255,0.06); border-radius: 10px;
  }
  .voce-menu {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 8px; border: none; border-radius: 10px;
    background: transparent; color: #eae4d6; cursor: pointer; transition: background 0.15s ease;
  }
  .voce-menu:hover { background: rgba(255,255,255,0.08); }
  .voce-attiva { background: var(--ambra); color: #2a1a06; font-weight: 600; }
  .voce-icona { font-size: 1.1rem; }
  .scheda { background: var(--carta-scheda); border: 1px solid var(--bordo); padding: 24px; border-radius: var(--raggio); box-shadow: var(--ombra); margin-bottom: 20px; }
  .intestazione-giorno { background: linear-gradient(135deg, var(--pino) 0%, var(--pino-scuro) 100%); color: #f6f1e4; border: none; }
  .intestazione-giorno h1 { color: #fff; }
  .etichetta-data { text-transform: capitalize; color: var(--ambra-lieve); margin: 0 0 4px; letter-spacing: 0.03em; }
  .intestazione-giorno .testo-secondario { color: #d8e4df; }
  .griglia-schede { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .scheda-cliccabile { cursor: pointer; text-align: left; }
  .scheda-cliccabile:hover { border-color: var(--pino); }
  .numero-grande { font-family: Georgia, serif; font-size: 2.1rem; color: var(--pino); margin: 4px 0; }
  .titolo-sezione { margin-top: 24px; }
  .riga-modulo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
  .riga-modulo input:not([type="checkbox"]):not([type="radio"]) { flex: 1; min-width: 160px; }
  .riga-modulo input[type="checkbox"], .riga-modulo input[type="radio"] { flex: 0 0 auto; width: 18px; height: 18px; min-width: 0; }
  .bottone-primario { padding: 10px 18px; border: none; border-radius: 10px; background: var(--pino); color: #fff; cursor: pointer; transition: background 0.15s ease; }
  .bottone-primario:hover { background: var(--pino-scuro); }
  .bottone-icona { border: none; background: transparent; cursor: pointer; font-size: 1rem; padding: 4px 6px; border-radius: 8px; line-height: 1; }
  .bottone-icona:hover { background: var(--ambra-lieve); }
  .lista-pulita { list-style: none; margin: 0; padding: 0; }
  .lista-pulita li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--bordo); }
  .lista-pulita li:last-child { border-bottom: none; }
  .testo-riga { flex: 1; }
  .testo-completato { text-decoration: line-through; color: var(--inchiostro-lieve); }
  .data-pillola { background: var(--ambra-lieve); color: #6b4110; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; white-space: nowrap; text-transform: capitalize; }
  .riga-oggi .data-pillola { background: var(--pino); color: #fff; }
  .lista-diario { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .pagina-diario { border-left: 3px solid var(--ambra); padding: 10px 16px; background: #fffdf8; border-radius: 0 10px 10px 0; }
  .pagina-diario-testata { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .pagina-diario-testo { margin: 0; white-space: pre-wrap; }
  .griglia-note { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .nota-adesiva { background: var(--ambra-lieve); border-radius: 8px; padding: 14px; min-height: 90px; display: flex; flex-direction: column; justify-content: space-between; transform: rotate(-1deg); }
  .nota-adesiva:nth-child(even) { transform: rotate(1deg); }
  .nota-adesiva p { margin: 0; white-space: pre-wrap; }
  .nota-adesiva .bottone-icona { align-self: flex-end; }
  .chip-categoria { padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .riga-filtri { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filtro-chip { border: 1px solid var(--bordo); background: var(--carta); color: var(--inchiostro-lieve); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; }
  .filtro-chip:hover { border-color: var(--pino); }
  .filtro-chip-attivo { background: var(--pino); color: #fff; border-color: var(--pino); }
  select { padding: 10px 12px; border: 1px solid var(--bordo); border-radius: 10px; background: var(--carta); color: var(--inchiostro); }
  .icona-ricorrenza { opacity: 0.7; margin-right: 2px; }
  .pallino-urgenza { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .pallino-oggi { background: var(--urgenza-oggi); box-shadow: 0 0 0 3px rgba(179,52,31,0.15); }
  .pallino-settimana { background: var(--urgenza-settimana); box-shadow: 0 0 0 3px rgba(201,124,44,0.15); }
  .pallino-piu-avanti { background: var(--urgenza-piu-avanti); }
  .sottotitolo-urgenza { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  .sottotitolo-urgenza h3 { margin: 0; }
  .conteggio-lieve { color: var(--inchiostro-lieve); font-size: 0.85rem; font-weight: 400; }
  .scheda-priorita { border-left: 4px solid var(--urgenza-oggi); background: #fdf3f1; }
  .scheda-priorita h3 { color: #7a2415; }
  .scheda-salute-intestazione { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .badge-salute { background: var(--salute-lieve); color: var(--salute); padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .badge-scadenza-vicina { background: var(--ambra-lieve); color: #6b4110; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .badge-scadenza-passata { background: #fdeceb; color: var(--urgenza-oggi); padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .orario-terapia { font-family: Georgia, serif; font-weight: 700; color: var(--salute); min-width: 52px; }
  .badge-finanza { background: var(--finanze-lieve); color: var(--finanze); padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .importo { font-family: Georgia, serif; font-weight: 700; min-width: 90px; text-align: right; }
  .importo-entrata { color: var(--finanze); }
  .importo-uscita { color: var(--urgenza-oggi); }
  .riepilogo-bilancio { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .cella-bilancio { background: var(--finanze-lieve); border-radius: 12px; padding: 12px 16px; }
  .cella-bilancio.uscita { background: #fdf3f1; }
  .cella-bilancio p { margin: 0; }
  .cella-bilancio .etichetta { font-size: 0.8rem; color: var(--inchiostro-lieve); }
  .cella-bilancio .valore { font-family: Georgia, serif; font-size: 1.4rem; font-weight: 700; color: var(--finanze); }
  .cella-bilancio.uscita .valore { color: var(--urgenza-oggi); }
  .badge-casa { background: var(--casa-lieve); color: var(--casa); padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .badge-emergenza { background: #fdeceb; color: var(--urgenza-oggi); padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
  .scheda-dat { border: 2px solid var(--urgenza-oggi); background: #fdf6f5; }
  .scheda-dat h1 { color: #7a2415; }
  .badge-niente-sangue { display: inline-block; background: var(--urgenza-oggi); color: #fff; padding: 4px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.02em; }
  .riga-dat { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bordo); }
  .riga-dat:last-child { border-bottom: none; }
  .riga-dat .etichetta-dat { min-width: 190px; font-weight: 600; color: var(--inchiostro-lieve); flex-shrink: 0; }
  .riga-dat .valore-dat { flex: 1; min-width: 200px; white-space: pre-wrap; }
  .riga-dat .valore-dat textarea, .riga-dat .valore-dat input { width: 100%; }
  .blocco-fiduciario { background: #fff; border: 1px solid var(--bordo); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .blocco-fiduciario h3 { margin-top: 0; }
  .opzioni-fine-vita label { display: block; margin-bottom: 6px; font-weight: normal; }
  .scheda-dat p.valore-dat { line-height: 1.5; }
  .opzione-non-scelta { text-decoration: line-through; color: var(--inchiostro-lieve); }
  .iniziali-scelta { background: var(--ambra-lieve); color: #6b4110; padding: 1px 8px; border-radius: 6px; font-weight: 700; margin-right: 6px; }
  .lista-spesa li.spesa-comprata .testo-riga { text-decoration: line-through; color: var(--inchiostro-lieve); }
  .banner-promemoria {
    background: var(--ambra-lieve); border: 1px solid var(--ambra); border-radius: var(--raggio);
    padding: 16px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
  }
  .banner-promemoria h3 { margin: 0 0 6px; color: #6b4110; }
  .banner-promemoria ul { margin: 0; padding-left: 18px; color: #6b4110; }
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .menu { width: 100%; padding: 18px; }
    .menu::after { display: none; }
    .voce-menu { display: inline-flex; width: auto; margin-right: 8px; }
    nav { display: flex; flex-wrap: wrap; }
    .contenuto { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<!-- Strumento temporaneo di diagnosi: mostra un pulsantino che apre una "console" visibile
     sullo schermo, utile su tablet/cellulare dove non è comodo usare F12. Si può togliere
     una volta risolto il problema di sincronizzazione. -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script>
  // Rilevatori temporanei di diagnosi: i telefoni a volte mostrano solo "Script error."
  // senza dettagli; questi due catturano il messaggio vero, se disponibile.
  window.addEventListener("error", function (e) {
    console.error("Errore rilevato:", e.message, "|", e.filename, "riga", e.lineno);
  });
  window.addEventListener("unhandledrejection", function (e) {
    console.error("Operazione fallita senza gestione:", e.reason);
  });
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="console.error('Non è stato possibile caricare firebase-app-compat.js (controlla la connessione internet)')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" onerror="console.error('Non è stato possibile caricare firebase-database-compat.js (controlla la connessione internet)')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="console.error('Non è stato possibile caricare firebase-auth-compat.js (controlla la connessione internet)')"></script>
<script>
(function () {
  "use strict";

  /* ===== Dati salvati nel browser ===== */

  function leggi(chiave) {
    try {
      var v = window.localStorage.getItem(chiave);
      return v !== null ? JSON.parse(v) : [];
    } catch (e) {
      return [];
    }
  }

  function scrivi(chiave, valore) {
    try {
      window.localStorage.setItem(chiave, JSON.stringify(valore));
    } catch (e) { /* modalità privata: pazienza, l'app funziona comunque */ }
    sincronizzaSubito();
  }

  function leggiOggetto(chiave, predefinito) {
    try {
      var v = window.localStorage.getItem(chiave);
      return v !== null ? JSON.parse(v) : predefinito;
    } catch (e) {
      return predefinito;
    }
  }

  /* ===== Sincronizzazione automatica tra dispositivi (Firebase) ===== */

  var firebaseConfig = {
    apiKey: "AIzaSyCO6Cs4E5BSJm4U5TBFqPpmLRuMiXxdG3g",
    authDomain: "agenda-giovanni-e4f2c.firebaseapp.com",
    databaseURL: "https://agenda-giovanni-e4f2c-default-rtdb.firebaseio.com",
    projectId: "agenda-giovanni-e4f2c",
    storageBucket: "agenda-giovanni-e4f2c.firebasestorage.app",
    messagingSenderId: "700098615039",
    appId: "1:700098615039:web:38ea1617b0132066c51eca"
  };

  var refDatiCloud = null;
  var timerSincronizzazione = null;
  var ultimoInvioLocale = 0;
  var statoSincronizzazione = "in attesa"; // "in attesa" | "connesso" | "non disponibile"

  var CAMPI_SINCRONIZZATI = {
    attivita: "agenda-attivita",
    appuntamenti: "agenda-appuntamenti",
    diario: "agenda-diario",
    note: "agenda-note",
    contatti: "agenda-contatti",
    cestino: "agenda-cestino",
    saluteVisite: "agenda-salute-visite",
    saluteTerapie: "agenda-salute-terapie",
    saluteDAT: "agenda-salute-dat",
    finanzeScadenze: "agenda-finanze-scadenze",
    finanzeMovimenti: "agenda-finanze-movimenti",
    casaSpesa: "agenda-casa-spesa",
    casaCommissioni: "agenda-casa-commissioni"
  };

  try {
    if (window.firebase) {
      firebase.initializeApp(firebaseConfig);
      // Accesso anonimo automatico: non chiede nulla a Giovanni, serve solo a far sì
      // che il database riconosca che la richiesta arriva dall'app e non da un estraneo.
      // Persistenza "NONE": quando il file si apre come file:// (doppio clic da Desktop),
      // Firebase normalmente prova a "ricordare" l'accesso tramite una finestra invisibile,
      // ma il browser la blocca perché ogni apertura di un file locale è un luogo isolato
      // a sé. Con NONE evitiamo del tutto quel meccanismo: ci si ricollega automaticamente
      // a ogni apertura, senza bisogno di ricordare nulla tra una volta e l'altra.
      firebase.auth().onAuthStateChanged(function (utente) {
        if (utente) {
          refDatiCloud = firebase.database().ref("agendaDati");
          avviaSincronizzazione();
        }
      });
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)
        .then(function () {
          return firebase.auth().signInAnonymously();
        })
        .catch(function (errore) {
          statoSincronizzazione = "non disponibile";
          console.error("Errore di accesso a Firebase:", errore);
        });
    }
  } catch (e) {
    refDatiCloud = null;
    console.error("Errore inizializzazione Firebase:", e.message || e);
  }

  function pacchettoStatoCorrente() {
    var pacchetto = {};
    Object.keys(CAMPI_SINCRONIZZATI).forEach(function (campo) {
      pacchetto[campo] = stato[campo];
    });
    pacchetto.aggiornatoIl = Date.now();
    return pacchetto;
  }

  function pianificaSincronizzazione() {
    if (!refDatiCloud) return;
    if (timerSincronizzazione) clearTimeout(timerSincronizzazione);
    timerSincronizzazione = setTimeout(function () {
      sincronizzaSubito();
    }, 800);
  }

  function sincronizzaSubito() {
    if (!refDatiCloud) return;
    if (timerSincronizzazione) { clearTimeout(timerSincronizzazione); timerSincronizzazione = null; }
    var pacchetto = pacchettoStatoCorrente();
    ultimoInvioLocale = pacchetto.aggiornatoIl;
    refDatiCloud.set(pacchetto).then(function () {
      statoSincronizzazione = "connesso";
    }).catch(function (errore) {
      statoSincronizzazione = "non disponibile";
      console.error("Errore invio dati a Firebase:", errore);
    });
  }

  function applicaDatiRemoti(dati) {
    if (!dati) return;
    // Se l'utente sta compilando il modulo "Aggiungi terapia" quando arriva una sincronizzazione
    // dal cloud, il ridisegno della pagina non deve cancellare quello che ha già scritto/spuntato.
    var campoOrarioAttuale = document.getElementById("campo-orario-terapia");
    var bozzaTerapia = campoOrarioAttuale ? {
      orario: campoOrarioAttuale.value,
      nome: document.getElementById("campo-nome-terapia").value,
      continuativo: document.getElementById("campo-continuativo-terapia").checked,
      scadenza: document.getElementById("campo-scadenza-terapia").value
    } : null;

    Object.keys(CAMPI_SINCRONIZZATI).forEach(function (campo) {
      // Firebase non salva le liste vuote (le omette): se manca, va intesa come lista vuota, non ignorata
      // (saluteDAT è un oggetto singolo, non una lista: se manca si usano i valori predefiniti)
      var predefinito = campo === "saluteDAT" ? DAT_PREDEFINITO : [];
      var valore = dati[campo] !== undefined ? dati[campo] : predefinito;
      if (campo === "saluteDAT") valore = Object.assign({}, DAT_PREDEFINITO, valore);
      stato[campo] = valore;
      try { window.localStorage.setItem(CAMPI_SINCRONIZZATI[campo], JSON.stringify(valore)); } catch (e) {}
    });
    statoSincronizzazione = "connesso";
    render();

    if (bozzaTerapia) {
      var campoOrarioNuovo = document.getElementById("campo-orario-terapia");
      if (campoOrarioNuovo) {
        campoOrarioNuovo.value = bozzaTerapia.orario;
        document.getElementById("campo-nome-terapia").value = bozzaTerapia.nome;
        document.getElementById("campo-continuativo-terapia").checked = bozzaTerapia.continuativo;
        document.getElementById("campo-scadenza-terapia").value = bozzaTerapia.scadenza;
      }
    }
  }

  function avviaSincronizzazione() {
    if (!refDatiCloud) return;

    refDatiCloud.once("value").then(function (istantanea) {
      if (!istantanea.val()) pianificaSincronizzazione(); // primo avvio: manda i dati locali al cloud
    }).catch(function (errore) {
      statoSincronizzazione = "non disponibile";
      console.error("Errore lettura iniziale da Firebase:", errore);
    });

    console.log("Firebase: accesso riuscito, in ascolto dei dati sul database...");

    refDatiCloud.on("value", function (istantanea) {
      var dati = istantanea.val();
      console.log("Firebase: dati ricevuti dal cloud", dati);
      if (!dati) return;
      if (dati.aggiornatoIl && dati.aggiornatoIl === ultimoInvioLocale) return; // ignora l'eco del mio stesso invio
      applicaDatiRemoti(dati);
    }, function (errore) {
      statoSincronizzazione = "non disponibile";
      console.error("Errore ascolto dati da Firebase:", errore);
    });

  /* ===== Ricorrenza appuntamenti ===== */

  function aggiungiGiorni(dataISO, n) {
    var d = new Date(dataISO + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function aggiungiMesi(dataISO, n) {
    var d = new Date(dataISO + "T00:00:00");
    var giorno = d.getDate();
    d.setMonth(d.getMonth() + n);
    if (d.getDate() !== giorno) d.setDate(0); // evita salti di mese con giorni overflow (es. 31 -> 30)
    return d.toISOString().slice(0, 10);
  }

  // Espande un appuntamento (anche ricorrente) nelle sue occorrenze da oggi in avanti
  function generaOccorrenze(appuntamento) {
    var oggi = dataOggiISO();
    if (!appuntamento.ricorrenza || appuntamento.ricorrenza === "nessuna") {
      return [appuntamento.data];
    }
    var limite = appuntamento.ricorrenza === "settimanale" ? 26 : 12;
    var passo = appuntamento.ricorrenza === "settimanale" ? 7 : null;
    var risultati = [];
    var cursore = appuntamento.data;
    for (var i = 0; i < limite; i++) {
      if (cursore >= oggi) risultati.push(cursore);
      cursore = passo ? aggiungiGiorni(cursore, passo) : aggiungiMesi(cursore, 1);
    }
    return risultati;
  }

  // Elenco unico di tutte le occorrenze (passate incluse per gli appuntamenti singoli,
  // solo future/oggi per quelli ricorrenti), ordinato per data
  function elencoAppuntamentiEspanso() {
    var elenco = [];
    stato.appuntamenti.forEach(function (a) {
      if (!a.ricorrenza || a.ricorrenza === "nessuna") {
        elenco.push({ base: a, data: a.data, ricorrente: false });
      } else {
        generaOccorrenze(a).forEach(function (data) {
          elenco.push({ base: a, data: data, ricorrente: true });
        });
      }
    });
    return elenco.sort(function (x, y) { return x.data.localeCompare(y.data); });
  }

  function impegniOggi() {

  /* ===== Assistente ===== */

  var NOMI_GIORNI_SETTIMANA = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
  var ALIAS_GIORNI_SETTIMANA = { "lunedi": "lunedì", "martedi": "martedì", "mercoledi": "mercoledì", "giovedi": "giovedì", "venerdi": "venerdì" };

  function prossimaDataGiorno(nomeGiorno) {
    var indiceTarget = NOMI_GIORNI_SETTIMANA.indexOf(nomeGiorno);
    if (indiceTarget < 0) return null;
    var oggi = new Date();
    var diff = (indiceTarget - oggi.getDay() + 7) % 7;
    var d = new Date(oggi);
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // Cerca nel testo del comando una data: "oggi", "domani", "dopodomani",
  // un giorno della settimana (prossima occorrenza), oppure gg/mm(/aaaa).
  function estraiData(testoInput) {
    var t = (testoInput || "").toLowerCase();
    if (t.indexOf("dopodomani") >= 0) return { dataISO: aggiungiGiorni(dataOggiISO(), 2), match: "dopodomani" };
    if (t.indexOf("domani") >= 0) return { dataISO: aggiungiGiorni(dataOggiISO(), 1), match: "domani" };
    if (t.indexOf("oggi") >= 0) return { dataISO: dataOggiISO(), match: "oggi" };
    var i, nome;
    for (i = 0; i < NOMI_GIORNI_SETTIMANA.length; i++) {
      nome = NOMI_GIORNI_SETTIMANA[i];
      if (t.indexOf(nome) >= 0) return { dataISO: prossimaDataGiorno(nome), match: nome };
    }
    for (var alias in ALIAS_GIORNI_SETTIMANA) {
      if (t.indexOf(alias) >= 0) return { dataISO: prossimaDataGiorno(ALIAS_GIORNI_SETTIMANA[alias]), match: alias };
    }
    var m = t.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
    if (m) {
      var gg = parseInt(m[1], 10), mm = parseInt(m[2], 10);
      var yyyy = m[3] ? parseInt(m[3], 10) : new Date().getFullYear();
      if (yyyy < 100) yyyy += 2000;
      var iso = yyyy + "-" + String(mm).padStart(2, "0") + "-" + String(gg).padStart(2, "0");
      return { dataISO: iso, match: m[0] };
    }
    return null;
  }

  function rispostaCerca(termine) {
    var html = '<h3>🔎 Risultati per "' + escapeHtml(termine) + '"</h3>';
    if (!termine) return html + '<p class="testo-secondario">Scrivi cosa cercare, ad esempio: "cerca dentista".</p>';
    var t = termine.toLowerCase();

    stato.diario.forEach(function (p) {

  function rispostaAggiungiAppuntamento(restoTesto) {
    var estratto = estraiData(restoTesto);

    var descrizione = restoTesto.replace(new RegExp(escapeRegExp(estratto.match), "i"), "").replace(/\s{2,}/g, " ").trim();
    descrizione = descrizione.replace(/^(il|per|di)\s+/i, "").replace(/\s+(il|per|di)$/i, "").trim() || "Appuntamento";
    stato.appuntamenti.push({ id: Date.now(), data: estratto.dataISO, testo: descrizione, ricorrenza: "nessuna" });

  function interpretaComando(testoOriginale) {
    var testo = (testoOriginale || "").trim();
    if (!testo) return '<p class="testo-secondario">Scrivi un comando per iniziare.</p>';
    var t = testo.toLowerCase();
    if (/riepilogo\s+oggi|cosa\s+ho\s+oggi/.test(t)) return rispostaRiepilogoOggi();
    if (/riepilogo\s+settiman|organizza.*settiman/.test(t)) return rispostaRiepilogoSettimana();
    if (/priorit|attivit[aà]\s+urgent/.test(t)) return rispostaPriorita();
    if (/^cerca\s+/.test(t)) return rispostaCerca(testo.replace(/^cerca\s+/i, "").trim());
    if (/^(aggiungi\s+(un\s+)?appuntamento|crea\s+(un\s+)?appuntamento)/.test(t)) {
      return rispostaAggiungiAppuntamento(testo.replace(/^(aggiungi\s+(un\s+)?appuntamento|crea\s+(un\s+)?appuntamento)\s*/i, ""));
    }
    if (/^ricordami/.test(t)) {
      return rispostaAggiungiAppuntamento(testo.replace(/^ricordami\s*(di\s+)?/i, ""));
    }

      case "diario": return e.dati.testo.length > 60 ? e.dati.testo.slice(0, 60) + "…" : e.dati.testo;

  function ripristinaElemento(id) {
    var voce = stato.cestino.filter(function (e) { return e.id === id; })[0];
    if (!voce) return;
    if (voce.tipo === "attivita") { stato.attivita.push(voce.dati); scrivi("agenda-attivita", stato.attivita); }
    if (voce.tipo === "appuntamento") { stato.appuntamenti.push(voce.dati); scrivi("agenda-appuntamenti", stato.appuntamenti); }
    if (voce.tipo === "diario") { stato.diario.push(voce.dati); scrivi("agenda-diario", stato.diario); }
    if (voce.tipo === "nota") { stato.note.push(voce.dati); scrivi("agenda-note", stato.note); }
    if (voce.tipo === "contatto") { stato.contatti.push(voce.dati); scrivi("agenda-contatti", stato.contatti); }
    if (voce.tipo === "visitaSalute") { stato.saluteVisite.push(voce.dati); scrivi("agenda-salute-visite", stato.saluteVisite); }
    if (voce.tipo === "terapia") { stato.saluteTerapie.push(voce.dati); scrivi("agenda-salute-terapie", stato.saluteTerapie); }
    if (voce.tipo === "scadenzaFinanza") { stato.finanzeScadenze.push(voce.dati); scrivi("agenda-finanze-scadenze", stato.finanzeScadenze); }
    if (voce.tipo === "movimentoFinanza") { stato.finanzeMovimenti.push(voce.dati); scrivi("agenda-finanze-movimenti", stato.finanzeMovimenti); }
    if (voce.tipo === "articoloSpesa") { stato.casaSpesa.push(voce.dati); scrivi("agenda-casa-spesa", stato.casaSpesa); }
    if (voce.tipo === "commissioneCasa") { stato.casaCommissioni.push(voce.dati); scrivi("agenda-casa-commissioni", stato.casaCommissioni); }
    stato.cestino = stato.cestino.filter(function (e) { return e.id !== id; });
    scrivi("agenda-cestino", stato.cestino);
    render();
  }

  function eliminaDefinitivo(id) {
    stato.cestino = stato.cestino.filter(function (e) { return e.id !== id; });
    scrivi("agenda-cestino", stato.cestino);
    render();
  }

  function svuotaCestino() {
    if (stato.cestino.length === 0) return;
    var conferma = window.confirm(
      "Vuoi svuotare tutto il cestino? Gli elementi eliminati definitivamente non potranno più essere ripristinati."

    stato.cestino = [];
    scrivi("agenda-cestino", stato.cestino);
    render();
  }

  var radice = document.getElementById("app");

  function render() {
    // Prima di ridisegnare la pagina, salviamo lo stato di qualsiasi campo/casella
    // che l'utente sta compilando (non ancora inviato), per non perderlo qualunque
    // sia la causa del ridisegno (sincronizzazione, clic altrove, ecc.)
    var bozzaCampi = {};
    radice.querySelectorAll("input[id], textarea[id], select[id]").forEach(function (el) {
      if (el.type === "checkbox" || el.type === "radio") {
        bozzaCampi[el.id] = { casella: true, valore: el.checked };
      } else {
        bozzaCampi[el.id] = { casella: false, valore: el.value };
      }
    });

    radice.innerHTML =
      '<div class="app">' +
        renderMenu() +
        '<main class="contenuto">' + renderSezione() + '</main>' +
      '</div>';

    Object.keys(bozzaCampi).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var b = bozzaCampi[id];
      if (b.casella) el.checked = b.valore; else el.value = b.valore;
    });

    collegaEventi();
  }

  function badgeScadenza(dataISO) {
    if (!dataISO) return "";
    var oggi = scadenzaOggiISO();
    var giorni = Math.round((new Date(dataISO) - new Date(oggi)) / 86400000);
    if (giorni < 0) return '<span class="badge-scadenza-passata">⚠️ scaduta il ' + formattaData(dataISO, { day: "numeric", month: "short" }) + '</span>';
    if (giorni <= 30) return '<span class="badge-scadenza-vicina">rinnovo entro il ' + formattaData(dataISO, { day: "numeric", month: "short" }) + '</span>';
    return '<span class="testo-secondario" style="margin:0;font-size:0.8rem;">rinnovo ' + formattaData(dataISO, { day: "numeric", month: "short", year: "numeric" }) + '</span>';
  }

  function renderFinanze() {

      scadenzeOrdinate.forEach(function (s) {
        html +=
          '<li>' +
            '<span class="badge-finanza">' + (etichetteCategoriaScadenza[s.categoria] || "Altro") + '</span>' +

          '<input type="date" id="campo-data-movimento" />' +

  // Aggiunge appuntamenti da un file esterno SENZA cancellare o sostituire i dati esistenti.
  // Salta eventuali doppioni (stessa data + stesso testo già presenti).
  function importaSoloAppuntamenti(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var dati;
      try {
        dati = JSON.parse(e.target.result);
      } catch (err) {
        window.alert("Il file selezionato non è valido.");
        return;
      }
      var nuovi = (dati && dati.appuntamenti) || [];
      if (!Array.isArray(nuovi) || nuovi.length === 0) {
        window.alert("Nessun appuntamento trovato nel file.");
        return;
      }
      var aggiunti = 0, saltati = 0;
      nuovi.forEach(function (n) {
        var esisteGia = stato.appuntamenti.some(function (a) {
          return a.data === n.data && a.testo === n.testo;
        });
        if (esisteGia) { saltati++; return; }
        stato.appuntamenti.push({
          id: Date.now() + Math.floor(Math.random() * 1000),
          data: n.data,
          testo: n.testo,
          ricorrenza: n.ricorrenza || "nessuna",
        });
        aggiunti++;
      });
      scrivi("agenda-appuntamenti", stato.appuntamenti);
      window.alert("Aggiunti " + aggiunti + " appuntamenti." + (saltati > 0 ? " (" + saltati + " già presenti, saltati)" : ""));
      render();
    };
    reader.readAsText(file);
  }

      diario: stato.diario,

      saluteTerapie: stato.saluteTerapie,
      saluteDAT: stato.saluteDAT,
      finanzeScadenze: stato.finanzeScadenze,
      finanzeMovimenti: stato.finanzeMovimenti,
      casaSpesa: stato.casaSpesa,
      casaCommissioni: stato.casaCommissioni,
    };
    var blob = new Blob([JSON.stringify(pacchetto, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "agenda-giovanni-backup-" + dataOggiISO() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    window.alert(
      "Backup scaricato.\n\n" +
      "Esportato il: " + new Date().toLocaleString("it-IT") + "\n" +
      "Appuntamenti contenuti: " + stato.appuntamenti.length
    );
  }
